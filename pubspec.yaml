name: siraj_app
description: "SIRAJ LMS - تطبيق منصة سراج التعليمية"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Routing
  go_router: ^14.2.7

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.2.0+3
  percent_indicator: ^4.2.3
  timeago: ^3.7.0

  # Media
  video_player: ^2.9.2
  chewie: ^1.8.5
  image_picker: ^1.1.2

  # Payments checkout (Stripe hosted checkout via WebView)
  webview_flutter: ^4.10.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  logger: ^2.4.0
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
