name: Build & Distribute SIRAJ APK

# يشتغل تلقائي مع كل push على main، أو يدويًا من تبويب Actions في GitHub
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}

      # يرفع الـ APK على Firebase App Distribution مجانًا لأي عدد "tester" تحددهم
      # التوثيق: https://firebase.google.com/docs/app-distribution/android/distribute-cli
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "بيلد تلقائي من GitHub Actions - ${{ github.sha }}"
